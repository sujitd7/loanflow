site_name: LoanFlow
site_description: >-
  Loan-underwriting maker-checker workbench — a learning project on
  React + FastAPI + PostgreSQL with a guard-railed Claude Code workflow.
site_author: sujitd7
# Update the org/repo slug once the GitHub repo exists (see docs/STATUS.md).
site_url: https://sujitd7.github.io/LoanFlow/
repo_url: https://github.com/sujitd7/loanflow
repo_name: sujitd7/loanflow
edit_uri: edit/main/docs/
copyright: Built in the open as a learning project.

docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - State machine: STATE_MACHINE.md
  - Roadmap: ROADMAP.md
  - Status: STATUS.md
  - Local dev: LOCAL_DEV.md
  - AI workflow: ai-workflow.md
  - ADRs:
      - Record architecture decisions: adr/0001-record-architecture-decisions.md
      - APScheduler over Celery: adr/0002-apscheduler-over-celery.md
  - Contributing to the docs: CONTRIBUTING-docs.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sujitd7/loanflow

# Install: pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^api/|^worker/
      - id: ruff-format
        files: ^api/|^worker/

  - repo: local
    hooks:
      - id: web-prettier
        name: prettier (web)
        entry: bash -c 'cd web && npx --yes prettier --write "$@"' --
        language: system
        files: ^web/.*\.(ts|tsx|css|json|md)$
      - id: web-eslint
        name: eslint (web)
        entry: bash -c 'cd web && npx --yes eslint --fix "$@"' --
        language: system
        files: ^web/.*\.(ts|tsx)$

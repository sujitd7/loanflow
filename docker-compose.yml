name: loanflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loanflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loanflow}
      POSTGRES_DB: ${POSTGRES_DB:-loanflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loanflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://loanflow:loanflow@db:5432/loanflow}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      target: dev
    command: python -m worker.main
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://loanflow:loanflow@db:5432/loanflow}
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-30}
      HOUSEKEEPING_CRON: ${HOUSEKEEPING_CRON:-0 2 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./worker:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
